# Every part of LeafGuard is scraped: the API, the host, all containers, the batch
# pipeline (through the Pushgateway), MLflow, and Prometheus itself.

global:
  scrape_interval: 5s          # fast enough for the dashboards to feel live in a demo
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  - job_name: leafguard-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels: {component: api}

  # Stage duration, throughput and status pushed by the DVC pipeline stages.
  - job_name: leafguard-pipeline
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
        labels: {component: pipeline}

  - job_name: mlflow
    metrics_path: /metrics
    static_configs:
      - targets: ["mlflow:5000"]
        labels: {component: tracking}

  - job_name: host
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {component: host}

  # Per-container CPU and memory, which is how the model server is watched.
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: {component: containers}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: {component: monitoring}
